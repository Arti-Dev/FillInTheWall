name: Gradle Build + Deploy to Server

on:
  push:
    branches: [ "release" ]

jobs:
  build-deploy:

    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        ref: release
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Build with Gradle
      run: gradle build
      
    - name: SFTP upload
      uses: Dylan700/sftp-upload-action@latest
      with:
        server: ${{secrets.SFTP_HOST}}
        username: ${{secrets.SFTP_USER}}
        password: ${{secrets.SFTP_PASSWORD}}
        port: 2222
        uploads: |
          /home/runner/work/FillInTheWall/FillInTheWall/build/libs/ => /plugins/
        ignore: |
          !FillInTheWall.jar